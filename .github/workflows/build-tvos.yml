name: Build OrionTV tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # Xcode 15.4 / tvOS 17.5 SDK - the pairing that OrionTV's Expo 51 / RN 0.74 expects.
    runs-on: macos-14
    timeout-minutes: 120
    env:
      EXPO_TV: "1"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
    steps:
      - name: Checkout OrionTV
        uses: actions/checkout@v4
        with:
          repository: orion-lib/OrionTV
          ref: master

      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: .builder

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos || true
          pod --version
          node --version

      - name: Install JS dependencies
        run: |
          corepack enable
          yarn --version
          yarn install --network-timeout 600000

      - name: Generate tvOS native project
        run: npx expo prebuild --clean -p ios --no-install

      - name: Exclude unused iOS-only native modules
        run: |
          # These are listed as dependencies but never imported by OrionTV's code,
          # and their Obj-C uses APIs that do not exist on tvOS
          # (UIDocumentInteractionController, AssetsLibrary, QLPreviewController,
          # WKHTTPCookieStore). Keep them installed for Android/phone builds,
          # just don't autolink them into the tvOS app.
          cat > react-native.config.js <<'EOF'
          module.exports = {
            dependencies: {
              'react-native-blob-util': { platforms: { ios: null } },
              'react-native-file-viewer': { platforms: { ios: null } },
              '@react-native-cookies/cookies': { platforms: { ios: null } },
            },
          };
          EOF
          cat react-native.config.js

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update

      - name: Discover scheme
        id: scheme
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          # Workspace OrionTV.xcworkspace -> app scheme OrionTV.
          # Every pod also appears as a scheme, so match the workspace name exactly.
          APP="${WS%.xcworkspace}"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          SCHEME=$(xcodebuild -list -workspace "$WS" -json \
            | jq -r --arg n "$APP" '.workspace.schemes[] | select(. == $n)' | head -1)
          if [ -z "$SCHEME" ]; then
            echo "No scheme named '$APP'. Available:"; xcodebuild -list -workspace "$WS" -json | jq -r '.workspace.schemes[]'
            exit 1
          fi
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "selected: $SCHEME"

      - name: Build (Release, unsigned)
        run: |
          set -x
          cd ios
          xcodebuild \
            -workspace "${{ steps.scheme.outputs.workspace }}" \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            NODE_BINARY="$(which node)" \
            build

      - name: Package .ipa
        run: |
          set -e
          APP=$(find ios/build/Build/Products -name '*.app' -maxdepth 3 | head -1)
          if [ -z "$APP" ]; then
            echo "No .app produced. Build products:"; find ios/build/Build/Products -maxdepth 2 | head -40
            exit 1
          fi
          echo "app: $APP"
          ls -la "$APP" | head -20
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "WARNING: no main.jsbundle - this is a debug-style build and will need Metro"
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry OrionTV-tvos.ipa Payload
          ls -lh OrionTV-tvos.ipa
          unzip -l OrionTV-tvos.ipa | head -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrionTV-tvos-ipa
          path: out/OrionTV-tvos.ipa
          if-no-files-found: error
